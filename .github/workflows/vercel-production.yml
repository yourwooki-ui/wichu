name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  database-contracts:
    name: Verify Supabase migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Start isolated Supabase stack
        run: npx supabase start

      - name: Lint database functions
        run: npx supabase db lint --local --schema public --level warning --fail-on error

      - name: Run migration and RLS contracts
        run: npx supabase test db

      - name: Stop isolated Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  verify-and-deploy:
    name: Verify and deploy to Vercel
    needs: database-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Temporary product-review mode. Remove after sample QA is complete.
      EXPO_PUBLIC_ENABLE_REVIEW_SAMPLES: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate Expo SDK compatibility
        run: npx --yes expo-doctor

      - name: Verify application
        run: npm run verify

      - name: Install Vercel CLI
        run: npm install --global vercel@59.5.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        run: vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
